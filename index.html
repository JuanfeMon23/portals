<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sala de los Portales</title>
    <meta name="description" content="Portafolio: cada portal lleva a un proyecto." />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <header class="title" id="title">
      <h1>Sala de los Portales</h1>
      <p>Elige un portal y cruza</p>
    </header>

    <nav class="menu" aria-label="Proyectos" id="menu"></nav>

    <section class="card" id="card" aria-live="polite" hidden>
      <h2 id="card-name"></h2>
      <p id="card-tagline"></p>
      <ul id="card-stack"></ul>
      <span class="hint">Click para entrar</span>
    </section>

    <div class="veil" id="veil"></div>
    <div class="loader" id="loader"><span>Encendiendo los braseros…</span></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
