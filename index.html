<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sala de los Portales</title>
    <meta name="description" content="Portafolio: cada portal lleva a un proyecto." />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <header class="title" id="title">
      <h1>Sala de los Portales</h1>
      <p>Elige un portal y cruza</p>
    </header>

    <nav class="menu" aria-label="Proyectos" id="menu"></nav>

    <section class="card" id="card" aria-live="polite" hidden>
      <h2 id="card-name"></h2>
      <p id="card-tagline"></p>
      <ul id="card-stack"></ul>
      <span class="hint">Click para entrar</span>
    </section>

    <div class="crossing" id="crossing" aria-live="polite"><strong></strong><span></span></div>
    <div class="loader" id="loader">
      <div class="sigil" aria-hidden="true">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <svg class="runes" viewBox="0 0 230 230"><path transform="translate(207.0 115.0) rotate(90)" d="M0 -9 L0 9 M0 -3.4 L6 -2.2 M0 -6.2 L-6 -7.3"/><path transform="translate(202.5 143.4) rotate(108)" d="M0 -9 L0 9 M0 -6.4 L-6 -10.1 M0 -2.2 L6 -5.5"/><path transform="translate(189.4 169.1) rotate(126)" d="M0 -9 L0 9 M0 -2.3 L-6 -5.3 M0 -4.5 L-6 -1.0"/><path transform="translate(169.1 189.4) rotate(144)" d="M0 -9 L0 9 M0 -0.7 L6 3.2 M0 -6.5 L-6 -8.2"/><path transform="translate(143.4 202.5) rotate(162)" d="M0 -9 L0 9 M0 -5.4 L6 -6.9 M0 2.0 L6 2.6"/><path transform="translate(115.0 207.0) rotate(180)" d="M0 -9 L0 9 M0 0.0 L6 0.4 M0 -6.3 L6 -8.7"/><path transform="translate(86.6 202.5) rotate(198)" d="M0 -9 L0 9 M0 0.5 L6 -1.0 M0 -0.6 L6 -2.2"/><path transform="translate(60.9 189.4) rotate(216)" d="M0 -9 L0 9 M0 1.7 L-6 -0.3 M0 -0.7 L-6 2.3"/><path transform="translate(40.6 169.1) rotate(234)" d="M0 -9 L0 9 M0 1.0 L6 4.9 M0 -5.7 L6 -3.6"/><path transform="translate(27.5 143.4) rotate(252)" d="M0 -9 L0 9 M0 -5.3 L6 -9.0 M0 0.4 L-6 0.9"/><path transform="translate(23.0 115.0) rotate(270)" d="M0 -9 L0 9 M0 2.6 L6 4.2 M0 -0.5 L-6 -0.8"/><path transform="translate(27.5 86.6) rotate(288)" d="M0 -9 L0 9 M0 2.2 L-6 2.0 M0 0.3 L6 1.9"/><path transform="translate(40.6 60.9) rotate(306)" d="M0 -9 L0 9 M0 0.1 L-6 2.7 M0 -3.9 L6 -2.5"/><path transform="translate(60.9 40.6) rotate(324)" d="M0 -9 L0 9 M0 -6.8 L6 -9.4 M0 -5.7 L6 -3.6"/><path transform="translate(86.6 27.5) rotate(342)" d="M0 -9 L0 9 M0 -5.6 L6 -6.4 M0 2.6 L6 2.2"/><path transform="translate(115.0 23.0) rotate(360)" d="M0 -9 L0 9 M0 -1.0 L-6 1.6 M0 2.5 L6 1.8"/><path transform="translate(143.4 27.5) rotate(378)" d="M0 -9 L0 9 M0 -3.1 L-6 0.6 M0 -5.3 L6 -7.5"/><path transform="translate(169.1 40.6) rotate(396)" d="M0 -9 L0 9 M0 -4.4 L6 -3.7 M0 -4.1 L6 -4.8"/><path transform="translate(189.4 60.9) rotate(414)" d="M0 -9 L0 9 M0 -2.9 L-6 0.7 M0 0.6 L-6 1.5"/><path transform="translate(202.5 86.6) rotate(432)" d="M0 -9 L0 9 M0 0.4 L6 3.6 M0 1.6 L-6 4.0"/></svg>
        <div class="core"></div>
      </div>
      <p>Encendiendo los braseros…</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
