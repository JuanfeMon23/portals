<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Santuario</title>
    <meta name="description" content="Portafolio: cada portal lleva a un proyecto." />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <header class="title" id="title">
      <h1>El Santuario</h1>
      <p>Sube por las casas y cruza su puerta</p>
    </header>

    <nav class="menu" aria-label="Proyectos" id="menu"></nav>

    <section class="card" id="card" aria-live="polite" hidden>
      <h2 id="card-name"></h2>
      <p id="card-tagline"></p>
      <ul id="card-stack"></ul>
      <span class="hint">Click para entrar</span>
    </section>

    <div class="crossing" id="crossing" aria-live="polite"><strong></strong><span></span></div>
    <div class="loader" id="loader">
      <div class="sigil" aria-hidden="true">
        <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
        <div class="glyphs"><i style="--i:0">♈&#xFE0E;</i><i style="--i:1">♉&#xFE0E;</i><i style="--i:2">♊&#xFE0E;</i><i style="--i:3">♋&#xFE0E;</i><i style="--i:4">♌&#xFE0E;</i><i style="--i:5">♍&#xFE0E;</i><i style="--i:6">♎&#xFE0E;</i><i style="--i:7">♏&#xFE0E;</i><i style="--i:8">♐&#xFE0E;</i><i style="--i:9">♑&#xFE0E;</i><i style="--i:10">♒&#xFE0E;</i><i style="--i:11">♓&#xFE0E;</i></div>
        <div class="core"></div>
      </div>
      <p>Encendiendo el cosmos…</p>
    </div>

    <script type="module" src="/src/houses/main.js"></script>
  </body>
</html>
